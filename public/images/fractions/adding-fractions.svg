<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" font-family="system-ui, sans-serif">
  <!-- Adding 1/4 + 2/4 = 3/4 with bar model -->
  <text x="200" y="22" text-anchor="middle" font-size="16" font-weight="600" fill="#374151">Scitani: 1/4 + 2/4 = 3/4</text>

  <!-- Bar 1: 1/4 -->
  <text x="20" y="62" font-size="16" font-weight="700" fill="#2563EB">1/4</text>
  <g transform="translate(55, 40)">
    <rect x="0" y="0" width="55" height="30" rx="4" fill="#3B82F6" stroke="#1E40AF" stroke-width="1.5"/>
    <rect x="57" y="0" width="55" height="30" rx="4" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
    <rect x="114" y="0" width="55" height="30" rx="4" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
    <rect x="171" y="0" width="55" height="30" rx="4" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
  </g>

  <!-- Plus sign -->
  <text x="290" y="62" font-size="24" font-weight="700" fill="#374151">+</text>

  <!-- Bar 2: 2/4 -->
  <text x="20" y="102" font-size="16" font-weight="700" fill="#059669">2/4</text>
  <g transform="translate(55, 80)">
    <rect x="0" y="0" width="55" height="30" rx="4" fill="#10B981" stroke="#047857" stroke-width="1.5"/>
    <rect x="57" y="0" width="55" height="30" rx="4" fill="#10B981" stroke="#047857" stroke-width="1.5"/>
    <rect x="114" y="0" width="55" height="30" rx="4" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
    <rect x="171" y="0" width="55" height="30" rx="4" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
  </g>

  <!-- Equals line -->
  <line x1="55" y1="120" x2="281" y2="120" stroke="#374151" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Bar 3: 3/4 result -->
  <text x="20" y="150" font-size="16" font-weight="700" fill="#D97706">3/4</text>
  <g transform="translate(55, 130)">
    <rect x="0" y="0" width="55" height="30" rx="4" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
    <rect x="57" y="0" width="55" height="30" rx="4" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
    <rect x="114" y="0" width="55" height="30" rx="4" fill="#F59E0B" stroke="#D97706" stroke-width="1.5"/>
    <rect x="171" y="0" width="55" height="30" rx="4" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
  </g>

  <!-- Result annotation -->
  <rect x="290" y="125" width="100" height="40" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="340" y="143" text-anchor="middle" font-size="11" fill="#92400E">1 + 2 = 3</text>
  <text x="340" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">= 3/4</text>
</svg>
