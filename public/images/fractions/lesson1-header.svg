<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" font-family="system-ui, sans-serif">
  <!-- Lesson 1 header: What are fractions? -->
  <defs>
    <linearGradient id="l1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" fill="url(#l1bg)" rx="10"/>

  <!-- Pizza illustration -->
  <g transform="translate(60, 30)">
    <circle cx="70" cy="70" r="65" fill="#FCD34D" stroke="#D97706" stroke-width="2.5"/>
    <!-- Cheese texture -->
    <circle cx="45" cy="50" r="3" fill="#F59E0B"/>
    <circle cx="85" cy="40" r="2.5" fill="#F59E0B"/>
    <circle cx="60" cy="90" r="3" fill="#F59E0B"/>
    <circle cx="90" cy="80" r="2" fill="#F59E0B"/>
    <!-- Cross cuts -->
    <line x1="70" y1="5" x2="70" y2="135" stroke="#D97706" stroke-width="2"/>
    <line x1="5" y1="70" x2="135" y2="70" stroke="#D97706" stroke-width="2"/>
    <!-- Highlighted quarter -->
    <path d="M70,70 L70,5 A65,65 0 0,1 135,70 Z" fill="#EF4444" opacity="0.6"/>
    <!-- Pepperoni -->
    <circle cx="95" cy="45" r="6" fill="#DC2626"/>
    <circle cx="50" cy="45" r="6" fill="#DC2626"/>
    <circle cx="50" cy="95" r="6" fill="#DC2626"/>
    <circle cx="95" cy="90" r="6" fill="#DC2626"/>
    <!-- Center dot -->
    <circle cx="70" cy="70" r="4" fill="#D97706"/>
  </g>

  <!-- Labels -->
  <text x="260" y="60" text-anchor="middle" font-size="18" font-weight="700" fill="#1E40AF">Co jsou</text>
  <text x="260" y="90" text-anchor="middle" font-size="28" font-weight="800" fill="#1E40AF">zlomky?</text>

  <!-- Small fraction -->
  <g transform="translate(230, 110)">
    <rect x="0" y="0" width="60" height="50" rx="10" fill="white" stroke="#3B82F6" stroke-width="2"/>
    <text x="30" y="20" text-anchor="middle" font-size="16" font-weight="700" fill="#1E40AF">1</text>
    <line x1="12" y1="26" x2="48" y2="26" stroke="#1E40AF" stroke-width="2" stroke-linecap="round"/>
    <text x="30" y="44" text-anchor="middle" font-size="16" font-weight="700" fill="#1E40AF">4</text>
  </g>

  <!-- Arrow -->
  <text x="260" y="185" text-anchor="middle" font-size="13" fill="#6B7280" font-weight="500">Lekce 1</text>
</svg>
