<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="system-ui, sans-serif">
  <!-- Course header: Fractions world -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#bg)" rx="12"/>

  <!-- Decorative fraction circles -->
  <circle cx="680" cy="60" r="40" fill="rgba(255,255,255,0.1)"/>
  <circle cx="720" cy="180" r="25" fill="rgba(255,255,255,0.08)"/>
  <circle cx="100" cy="240" r="35" fill="rgba(255,255,255,0.08)"/>
  <circle cx="60" cy="80" r="20" fill="rgba(255,255,255,0.06)"/>

  <!-- Pizza fraction icon -->
  <g transform="translate(80, 90)">
    <circle cx="60" cy="60" r="55" fill="#F59E0B" stroke="white" stroke-width="3"/>
    <line x1="60" y1="5" x2="60" y2="115" stroke="white" stroke-width="2.5"/>
    <line x1="5" y1="60" x2="115" y2="60" stroke="white" stroke-width="2.5"/>
    <path d="M60,60 L60,5 A55,55 0 0,1 115,60 Z" fill="#EF4444" opacity="0.7"/>
    <circle cx="40" cy="40" r="4" fill="#DC2626"/>
    <circle cx="80" cy="45" r="4" fill="#DC2626"/>
    <circle cx="45" cy="80" r="4" fill="#DC2626"/>
    <circle cx="78" cy="78" r="4" fill="#DC2626"/>
  </g>

  <!-- Bar model decoration -->
  <g transform="translate(550, 120)">
    <rect x="0" y="0" width="40" height="25" rx="4" fill="#3B82F6" stroke="white" stroke-width="1.5"/>
    <rect x="44" y="0" width="40" height="25" rx="4" fill="#3B82F6" stroke="white" stroke-width="1.5"/>
    <rect x="88" y="0" width="40" height="25" rx="4" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1.5"/>
    <rect x="132" y="0" width="40" height="25" rx="4" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1.5"/>
    <text x="86" y="50" text-anchor="middle" font-size="14" fill="rgba(255,255,255,0.8)" font-weight="600">2/4</text>
  </g>

  <!-- Title -->
  <text x="300" y="140" text-anchor="middle" font-size="42" font-weight="800" fill="white">Zlomky</text>
  <text x="300" y="175" text-anchor="middle" font-size="20" fill="rgba(255,255,255,0.85)" font-weight="400">Matematika pro 5. tridu</text>

  <!-- Fraction examples -->
  <g transform="translate(240, 200)">
    <rect x="0" y="0" width="50" height="36" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="25" y="15" text-anchor="middle" font-size="11" fill="white" font-weight="700">1</text>
    <line x1="12" y1="18" x2="38" y2="18" stroke="white" stroke-width="1.5"/>
    <text x="25" y="32" text-anchor="middle" font-size="11" fill="white" font-weight="700">2</text>
  </g>
  <g transform="translate(300, 200)">
    <rect x="0" y="0" width="50" height="36" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="25" y="15" text-anchor="middle" font-size="11" fill="white" font-weight="700">3</text>
    <line x1="12" y1="18" x2="38" y2="18" stroke="white" stroke-width="1.5"/>
    <text x="25" y="32" text-anchor="middle" font-size="11" fill="white" font-weight="700">4</text>
  </g>
  <g transform="translate(360, 200)">
    <rect x="0" y="0" width="50" height="36" rx="8" fill="rgba(255,255,255,0.15)"/>
    <text x="25" y="15" text-anchor="middle" font-size="11" fill="white" font-weight="700">2</text>
    <line x1="12" y1="18" x2="38" y2="18" stroke="white" stroke-width="1.5"/>
    <text x="25" y="32" text-anchor="middle" font-size="11" fill="white" font-weight="700">5</text>
  </g>

  <!-- Measuring cup icon -->
  <g transform="translate(640, 200)">
    <rect x="0" y="10" width="30" height="50" rx="4" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="1.5"/>
    <rect x="0" y="35" width="30" height="25" rx="0 0 4 4" fill="#10B981" stroke="white" stroke-width="1.5"/>
    <rect x="30" y="25" width="8" height="10" rx="3" fill="none" stroke="white" stroke-width="1.5"/>
  </g>
</svg>
