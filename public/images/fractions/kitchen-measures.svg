<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" font-family="system-ui, sans-serif">
  <!-- Kitchen measuring cups showing 1/4, 1/3, 1/2, 1 -->
  <text x="200" y="22" text-anchor="middle" font-size="16" font-weight="600" fill="#374151">Odmerky v kuchyni</text>

  <!-- Cup 1: 1/4 -->
  <g transform="translate(30, 40)">
    <rect x="10" y="80" width="50" height="100" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="10" y="155" width="50" height="25" rx="0 0 6 6" fill="#3B82F6" stroke="#2563EB" stroke-width="2"/>
    <rect x="60" y="110" width="12" height="16" rx="4" fill="none" stroke="#2563EB" stroke-width="2"/>
    <text x="35" y="172" text-anchor="middle" font-size="11" fill="white" font-weight="700">1/4</text>
    <text x="35" y="195" text-anchor="middle" font-size="12" fill="#374151" font-weight="600">1/4</text>
    <!-- Level lines -->
    <line x1="14" y1="155" x2="56" y2="155" stroke="#93C5FD" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="14" y1="130" x2="56" y2="130" stroke="#93C5FD" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="14" y1="105" x2="56" y2="105" stroke="#93C5FD" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- Cup 2: 1/3 -->
  <g transform="translate(120, 40)">
    <rect x="10" y="70" width="55" height="110" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="10" y="143" width="55" height="37" rx="0 0 6 6" fill="#10B981" stroke="#059669" stroke-width="2"/>
    <rect x="65" y="105" width="12" height="16" rx="4" fill="none" stroke="#059669" stroke-width="2"/>
    <text x="37" y="168" text-anchor="middle" font-size="11" fill="white" font-weight="700">1/3</text>
    <text x="37" y="195" text-anchor="middle" font-size="12" fill="#374151" font-weight="600">1/3</text>
    <line x1="14" y1="143" x2="61" y2="143" stroke="#6EE7B7" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="14" y1="107" x2="61" y2="107" stroke="#6EE7B7" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- Cup 3: 1/2 -->
  <g transform="translate(215, 40)">
    <rect x="10" y="60" width="60" height="120" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="10" y="120" width="60" height="60" rx="0 0 6 6" fill="#F59E0B" stroke="#D97706" stroke-width="2"/>
    <rect x="70" y="100" width="12" height="16" rx="4" fill="none" stroke="#D97706" stroke-width="2"/>
    <text x="40" y="157" text-anchor="middle" font-size="13" fill="white" font-weight="700">1/2</text>
    <text x="40" y="195" text-anchor="middle" font-size="12" fill="#374151" font-weight="600">1/2</text>
    <line x1="14" y1="120" x2="66" y2="120" stroke="#FCD34D" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- Cup 4: 1 (full) -->
  <g transform="translate(310, 40)">
    <rect x="10" y="50" width="65" height="130" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="10" y="50" width="65" height="130" rx="6" fill="#8B5CF6" stroke="#7C3AED" stroke-width="2"/>
    <rect x="75" y="95" width="12" height="16" rx="4" fill="none" stroke="#7C3AED" stroke-width="2"/>
    <text x="42" y="122" text-anchor="middle" font-size="16" fill="white" font-weight="700">1</text>
    <text x="42" y="195" text-anchor="middle" font-size="12" fill="#374151" font-weight="600">1 cely</text>
  </g>
</svg>
