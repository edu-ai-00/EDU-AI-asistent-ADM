<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" font-family="system-ui, sans-serif">
  <!-- Fraction anatomy: numerator / denominator -->
  <text x="200" y="24" text-anchor="middle" font-size="16" font-weight="600" fill="#374151">Casti zlomku</text>

  <!-- Large fraction display -->
  <text x="120" y="95" text-anchor="middle" font-size="56" font-weight="700" fill="#1E40AF">3</text>
  <line x1="85" y1="110" x2="155" y2="110" stroke="#1E40AF" stroke-width="4" stroke-linecap="round"/>
  <text x="120" y="155" text-anchor="middle" font-size="56" font-weight="700" fill="#1E40AF">8</text>

  <!-- Arrows to labels -->
  <!-- Numerator arrow -->
  <line x1="160" y1="82" x2="200" y2="70" stroke="#DC2626" stroke-width="2" marker-end="url(#arrR)"/>
  <rect x="204" y="48" width="170" height="44" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="289" y="67" text-anchor="middle" font-size="15" font-weight="700" fill="#DC2626">CITATEL</text>
  <text x="289" y="84" text-anchor="middle" font-size="12" fill="#991B1B">kolik dilu mame</text>

  <!-- Fraction line arrow -->
  <line x1="160" y1="110" x2="200" y2="120" stroke="#059669" stroke-width="2" marker-end="url(#arrG)"/>
  <rect x="204" y="106" width="170" height="30" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="289" y="126" text-anchor="middle" font-size="13" font-weight="600" fill="#059669">ZLOMKOVA CARA</text>

  <!-- Denominator arrow -->
  <line x1="160" y1="145" x2="200" y2="160" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrP)"/>
  <rect x="204" y="148" width="170" height="44" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="289" y="167" text-anchor="middle" font-size="15" font-weight="700" fill="#7C3AED">JMENOVATEL</text>
  <text x="289" y="184" text-anchor="middle" font-size="12" fill="#5B21B6">na kolik dilu delime</text>

  <defs>
    <marker id="arrR" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#DC2626"/></marker>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#059669"/></marker>
    <marker id="arrP" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#7C3AED"/></marker>
  </defs>

  <!-- Bottom: meaning -->
  <text x="200" y="212" text-anchor="middle" font-size="14" fill="#6B7280">3 dily z celku rozdeleneho na 8 casti</text>
</svg>
